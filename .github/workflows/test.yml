name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew check --info

      - name: Verify plugin against target IDEs
        run: ./gradlew verifyPlugin

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Launch sandbox IDE with robot-server for UI testing
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run --auto-servernum ./gradlew runIdeForUiTests > runIde.log 2>&1 &
          echo "Waiting for robot-server on :8082..."
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8082 > /dev/null && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8082 > /dev/null || (cat runIde.log; exit 1)

      - name: Run UI smoke test
        run: ./gradlew uiTest --info

      - name: Upload IDE log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-ide-log
          path: runIde.log

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: build/reports/tests/uiTest/
