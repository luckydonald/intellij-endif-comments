pluginGroup = de.luckydonald.endifcomments
pluginName = Explicit Block Endings
pluginVersion = 1.0.0
pluginRepositoryUrl = https://github.com/luckydonald/intellij-endif-comments

# The target PyCharm version this plugin is built/tested against. PyCharm Community and
# Professional were unified into a single free-by-default distribution as of 2025.1/2025.3, so
# `PY` (not the legacy, pre-unification `PC`/`PY` split) is the type to build against now.
# PythonCore stays the bundled Python-support module either way, so no `Pythonid` dependency is needed.
platformType = PY
platformVersion = 2026.2.1
pluginSinceBuild = 243

kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
